name: Global Multi-Stack Production Pipeline

# =========================================================================
# TRIGGER LAYER (Jenkins Equivalent: Build Triggers / Poll SCM)
# =========================================================================
on:
  push:
    branches: 
      - "main"
      - "feature/**"    
  pull_request:
    branches: 
      - "main"
  release:
    types: [ published ]
  schedule:
    - cron: '0 0 * * 0' 
    
  # PARAMETERIZED MANUAL TRIGGER (Jenkins Equivalent: 'This build is parameterized')
  workflow_dispatch:   
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - 'staging'
          - 'uat'
          - 'production' 
      deploy_confirmation:
        description: 'Force Deployment? (Leave unchecked to run CI-only)'
        required: true
        default: false
        type: boolean

# =========================================================================
# LEVEL 1: GLOBAL ENVIRONMENT VARIABLES (Workflow-Scope)
# =========================================================================
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  APP_TEAM: "devops-core"
  SERVICE_LIST: "api-gateway frontend auth-service" 
  TEAM_EMAILS: '{"devops": "devops@company.com", "qa": "qa@company.com"}' 

jobs:
  # =========================================================================
  # STAGE 1: CODE QUALITY GATE (SONARQUBE)
  # =========================================================================
  sonar-sast-scan:
    runs-on: ubuntu-latest 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 

      - name: Run SonarQube Analysis
        uses: sonarSource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # =========================================================================
  # STAGE 2: DEPENDENCY SCANNING (SNYK)
  # =========================================================================
  snyk-sca-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Snyk Open Source Vulnerability Scan
        uses: snyk/actions/python@master 
        continue-on-error: true 
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # =========================================================================
  # STAGE 3: MULTI-ENVIRONMENT PARALLEL MATRIX TESTING
  # =========================================================================
  matrix-unit-testing:
    needs: [sonar-sast-scan, snyk-sca-scan]
    strategy:
      fail-fast: false 
      matrix:
        os-platform: [ubuntu-latest, windows-latest]
        python-runtime: ["3.10", "3.11"]
        include:
          - os-platform: windows-latest
            python-runtime: "3.11"
            experimental_flag: "true"

    runs-on: ${{ matrix.os-platform }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Matrix Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-runtime }}
          cache: 'pip'

      - name: Run Framework Test Suite Parallel Split
        run: |
          echo "Current Host Runner OS System OS: ${{ matrix.os-platform }}"
          echo "Current Target Code Runtime Engine: ${{ matrix.python-runtime }}"

  # =========================================================================
  # STAGE 4: APPLICATION COMPILATION, FILE OPERATIONS & SECRETS INJECTION
  # =========================================================================
  build-and-publish-artifacts:
    runs-on: ubuntu-latest
    needs: matrix-unit-testing 
    
    env:
      BUILD_PROFILE: "production-optimized"
      NODE_VERSION: "20"

    outputs:
      generated_app_version: ${{ steps.calc_version.outputs.computed_version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Java Stack)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js Runtime (UI Stack)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Calculate Version and Assign Variables
        id: calc_version 
        env:
          STEP_SPECIFIC_DEBUG: "true" 
        run: |
          RAW_VERSION="v1.0.$(date +%s)"
          echo "INTERNAL_VERSION=$RAW_VERSION" >> $GITHUB_ENV
          echo "computed_version=$RAW_VERSION" >> $GITHUB_OUTPUT

      - name: Verify and Parse Scoped Lists/Maps Variables
        run: |
          for service in $SERVICE_LIST; do
            echo "Assembling package component: $service"
          done
          DEVOPS_EMAIL=$(echo '$TEAM_EMAILS' | jq -r '.devops')

      - name: Bash File Operations (Write, Append, Read)
        run: |
          echo "=== Pipeline Build Log Initialized ===" > build-manifest.txt
          echo "Compiled at timestamp: $(date)" >> build-manifest.txt

      - name: Python JSON Operations (Create, Read, Parse, Update)
        run: |
          python3 -c "
          import json
          config_map = {'service_name': 'auth-api', 'active_profiles': ['oauth-enabled']}
          with open('app-config.json', 'w') as f:
              json.dump(config_map, f, indent=4)
          "

      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package-outputs
          path: |
            build-manifest.txt
            app-config.json

      # =====================================================================
      # SECRETS MANAGEMENT & ARTIFACTORY INTEGRATION INTERVIEW FOCUS
      # What: Secure credentials retrieval mapping.
      # How to configure in UI: Settings > Secrets and variables > Actions > New Repository Secret.
      # The 3 Tiers of Secrets available:
      #   1. Organization Level -> Shared globally across corporate repos.
      #   2. Repository Level -> Confined strictly to this single project code base.
      #   3. Environment Level -> Requires designated human approvers to unlock.
      # Key GHA Security Protections:
      #   - Blind-write design: Once saved in the UI, values can never be viewed or read again.
      #   - Log Masking: GHA automatically intercepts stdout/stderr logs and prints '***' for secrets.
      # Verified Industry Action: jfrog/setup-jfrog-cli@v4 (Official Integration)
      # =====================================================================
      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          # Extracting encrypted secrets at rest natively via the context layer
          JF_URL: ${{ secrets.JF_PLATFORM_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

      - name: Publish Binaries to JFrog Artifactory
        run: |
          # The JFrog CLI binary automatically detects JF_URL and JF_ACCESS_TOKEN inside the environment
          echo "Authenticating securely using masked GitHub Secrets..."
          echo "If a script accidentally executes an unmasked echo of the access token, GHA scrubs the output dynamically."
          # jf rt upload "target/*.jar" "generic-local-repo/java-apps/"

  # =========================================================================
  # STAGE 5: CONTAINER ASSEMBLY AND SECURITY DISCOVERY (SYSDIG)
  # =========================================================================
  container-security:
    runs-on: ubuntu-latest
    needs: build-and-publish-artifacts
    permissions:
      contents: read     
      packages: write    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Automatically provided short-lived dynamic secret token

      - name: Build Local Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false 
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Run Sysdig Image Vulnerability Scan
        uses: sysdiglabs/scan-action@v5
        with:
          image-tag: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          sysdig-secure-token: ${{ secrets.SYSDIG_SECURE_TOKEN }}
          sysdig-secure-url: "https://sysdigcloud.com"

      - name: Push Verified Image to Registry
        if: success() 
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # =========================================================================
  # STAGE 6: CLOUD-NATIVE DEPLOYMENT
  # =========================================================================
  deploy-to-kubernetes:
    runs-on: ubuntu-latest
    needs: [build-and-publish-artifacts, container-security] 
    if: |
      github.event_name != 'workflow_dispatch' || 
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_confirmation == 'true')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Read Captured App Version From Build Job
        run: |
          echo "Dynamic tag value passed from Stage 4: ${{ needs.build-and-publish-artifacts.outputs.generated_app_version }}"

      - name: Inject Image Tag into Manifest
        run: |
          TARGET_ENV="${{ github.event.inputs.environment || 'staging' }}"
          sed -i "s|DYNAMIC_IMAGE_TAG|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g" k8s-manifest.yaml
          
      - name: Verify Generated Manifest
        run: cat k8s-manifest.yaml
