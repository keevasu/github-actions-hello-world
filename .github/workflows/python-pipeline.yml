name: Production Python Pipeline

on:
  push:
    branches:
      - "main"
      - "feature/**"
  pull_request:
    branches:
      - "main"
  release:
    types: [ published ]
  schedule:
    - cron: '0 0 * * 0'
    
  # 1. Manual trigger enhanced with custom configuration parameters (Inputs)
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - uat
          - production
      deploy_confirmation:
        description: 'Force Deployment? (Leave unchecked to run CI-only)'
        required: true
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================================
  # JOB 1: ALWAYS RUNS (Consumes and prints your inputs)
  # ==========================================================
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # INTERVIEW HIGHLIGHT: Accessing manual inputs using the github.event.inputs context
      - name: Print Manual Parameters
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Target Environment Chosen: ${{ github.event.inputs.environment }}"
          echo "Deployment Force Checked: ${{ github.event.inputs.deploy_confirmation }}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} 

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ==========================================================
  # JOB 2: DEPLOYMENT STAGE (Conditional based on parameters)
  # ==========================================================
  deploy-to-kubernetes:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    # ADVANCED LOGIC: Run if it's NOT manual, OR if manual AND confirmation checkbox is checked true
    if: |
      github.event_name != 'workflow_dispatch' || 
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_confirmation == 'true')
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Injecting environment dynamically if it was a manual run, otherwise default to staging
      - name: Inject Image Tag into Manifest
        run: |
          TARGET_ENV="${{ github.event.inputs.environment || 'staging' }}"
          echo "Configuring manifest file for environment: ${TARGET_ENV}"
          sed -i "s|DYNAMIC_IMAGE_TAG|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g" k8s-manifest.yaml
          
      - name: Verify Generated Manifest
        run: cat k8s-manifest.yaml
