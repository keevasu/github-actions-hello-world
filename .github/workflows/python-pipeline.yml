name: Production Python Pipeline

# =========================================================================
# TRIGGER LAYER (When does this run?)
# =========================================================================
on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]
  release:
    types: [ published ]
  schedule:
    - cron: '0 0 * * 0' # Automated weekly cleanup/build (Every Sunday at Midnight UTC)
  workflow_dispatch:   # Manual UI execution button
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - 'staging'
          - 'uat'
          - 'production'
      deploy_confirmation:
        description: 'Force Deployment? (Leave unchecked to run CI-only)'
        required: true
        default: false
        type: boolean

# =========================================================================
# LEVEL 1: GLOBAL ENVIRONMENT VARIABLES (Workflow-Scope)
# =========================================================================
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  APP_TEAM: "devops-core"

jobs:
  # =========================================================================
  # JOB 1: THE COMPILATION AND CONTAINER GENERATION STAGE
  # =========================================================================
  build-and-test:
    runs-on: ubuntu-latest
    
    # =======================================================================
    # THE PERMISSIONS LAYER (Security Scoping)
    # What: Defines what the short-lived GITHUB_TOKEN is allowed to do.
    # Why: Enforces the principle of least privilege, preventing token leaks 
    #      from compromising your entire GitHub profile.
    # Other Options: 
    #   - id-token: write      -> For secure, passwordless login to AWS/GCP via OIDC.
    #   - pull-requests: write -> For auto-commenting test results onto open PRs.
    #   - security-events: write -> For uploading vulnerability scan results.
    # =======================================================================
    permissions:
      contents: read     # Required to checkout/clone your code safely.
      packages: write    # Required to publish your built image to GitHub Container Registry.

    env:
      BUILD_PROFILE: "production-optimized"
      PYTHON_VERSION: "3.11"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Print Manual Parameters and Environments
        if: github.event_name == 'workflow_dispatch'
        env:
          STEP_SPECIFIC_DEBUG: "true"
        run: |
          echo "Global Env (Registry): $REGISTRY"
          echo "Job Env (Build Profile): $BUILD_PROFILE"
          echo "Step Env (Debug Enabled): $STEP_SPECIFIC_DEBUG"
          echo "Target Environment Chosen via UI Input: ${{ github.event.inputs.environment }}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} 

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # =========================================================================
  # JOB 2: DEPLOYMENT STAGE
  # =========================================================================
  deploy-to-kubernetes:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    if: |
      github.event_name != 'workflow_dispatch' || 
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_confirmation == 'true')
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Image Tag into Manifest
        run: |
          TARGET_ENV="${{ github.event.inputs.environment || 'staging' }}"
          echo "Configuring manifest file for environment: ${TARGET_ENV}"
          sed -i "s|DYNAMIC_IMAGE_TAG|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g" k8s-manifest.yaml
          
      - name: Verify Generated Manifest
        run: cat k8s-manifest.yaml
