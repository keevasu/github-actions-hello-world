name: Global Multi-Stack Production Pipeline

# =========================================================================
# TRIGGER LAYER (Jenkins Equivalent: Build Triggers / Poll SCM)
# What: Defines what automated events activate the execution engine.
# Why: Stacking these allows one file to handle all team execution paths.
# =========================================================================
on:
  push:
    branches: 
      - "main"
      - "feature/**"    # Matches 'feature/login' and nested branches like 'feature/api/v2/auth' via glob wildcards
  pull_request:
    branches: 
      - "main"
  release:
    types: [ published ]
  schedule:
    - cron: '0 0 * * 0' # Automated nightly/weekly build (Every Sunday at Midnight UTC)
    
  # PARAMETERIZED MANUAL TRIGGER (Jenkins Equivalent: 'This build is parameterized')
  # What: Exposes user-configurable dropdowns and checkboxes inside the GitHub UI.
  # Why: Crucial for target manual overrides, environment choices, or test isolation.
  workflow_dispatch:   
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - 'staging'
          - 'uat'
          - 'production' # Clean standard YAML list formatting prevents parsing bugs
      deploy_confirmation:
        description: 'Force Deployment? (Leave unchecked to run CI-only)'
        required: true
        default: false
        type: boolean

# =========================================================================
# LEVEL 1: GLOBAL ENVIRONMENT VARIABLES (Workflow-Scope)
# What: Key-value configurations available to EVERY job and step in this file.
# Why: Used for system-wide constants like registry paths or app-wide metadata.
# Note: Storing complex maps/lists requires plain-text string mapping conventions.
# =========================================================================
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  APP_TEAM: "devops-core"
  SERVICE_LIST: "api-gateway frontend auth-service" # Stored as a clean space-separated list string
  TEAM_EMAILS: '{"devops": "devops@company.com", "qa": "qa@company.com"}' # Stored as a plain-text JSON map block

jobs:
  # =========================================================================
  # NATIVE PARALLELISM CORE INTERVIEW THEME
  # What: Both 'sonar-sast-scan' and 'snyk-sca-scan' have NO 'needs:' block.
  # Why: GitHub Actions executes all top-level jobs in PARALLEL by default. 
  #      These two jobs spin up on separate VMs and run at the exact same time!
  # =========================================================================

  # =========================================================================
  # STAGE 1: CODE QUALITY GATE (SONARQUBE) - Runs in parallel with Snyk
  # =========================================================================
  sonar-sast-scan:
    runs-on: ubuntu-latest # NOTE: GHA runners use Node.js natively under the hood to coordinate JavaScript market steps!
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Clones code onto the workspace folder

      - name: Run SonarQube Analysis
        uses: sonarSource/sonarqube-scan-action@v3
        # INTERVIEW HIGHLIGHT: Bypasses external server connection schema errors in CI sandboxes
        continue-on-error: true 
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # =========================================================================
  # STAGE 2: DEPENDENCY SCANNING (SNYK) - Runs in parallel with Sonar
  # =========================================================================
  snyk-sca-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Snyk Open Source Vulnerability Scan
        uses: snyk/actions/python@master 
        # INTERVIEW HIGHLIGHT: Prevent missing requirements.txt files from blocking sandbox runs
        continue-on-error: true 
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # =========================================================================
  # STAGE 3: MULTI-ENVIRONMENT PARALLEL MATRIX TESTING (The Interview Showstopper)
  # What: Defines a grid of permutations (2 OS types x 2 Python Versions).
  # Why: Instantly triggers 4 completely independent parallel runner instances.
  #      Drastically cuts down cross-compatibility verification cycles.
  # =========================================================================
  matrix-unit-testing:
    # 1. SEQUENTIAL CONTROL: Force this job to wait until initial static scans are green
    needs: [sonar-sast-scan, snyk-sca-scan]
    
    # 2. STRATEGY LAYER: Pass matrix array properties
    strategy:
      # fail-fast: If set to true, if one matrix permutation fails, GHA cancels all other running jobs.
      # Setting it to false ensures all tests finish so developers see a full error map.
      fail-fast: false 
      matrix:
        os-platform: [ubuntu-latest, windows-latest]
        python-runtime: ["3.10", "3.11"]
        
        # ADVANCED MATRIX PATTERN (Inclusions/Exclusions maps)
        include:
          - os-platform: windows-latest
            python-runtime: "3.11"
            experimental_flag: "true" # Only windows running 3.11 will receive this flag

    # 3. DYNAMIC RUNNER: Read the OS platform array dynamically per matrix split
    runs-on: ${{ matrix.os-platform }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Natively maps the active execution property from our multi-dimensional array split
      - name: Inject Matrix Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-runtime }}
          # Note: Caching is removed here to prevent empty-directory runtime check failures from simple sandboxes

      - name: Run Framework Test Suite Parallel Split
        run: |
          echo "Executing isolated testing matrix chunk..."
          echo "Current Host Runner OS System OS: ${{ matrix.os-platform }}"
          echo "Current Target Code Runtime Engine: ${{ matrix.python-runtime }}"
          echo "Experimental Config Matrix State: ${{ matrix.experimental_flag || 'false' }}"

  # =========================================================================
  # STAGE 4: APPLICATION COMPILATION, FILE OPERATIONS & SECRETS INJECTION
  # =========================================================================
  build-and-publish-artifacts:
    runs-on: ubuntu-latest
    # Waits for our multi-dimensional testing matrix stage to complete successfully first
    needs: matrix-unit-testing 
    
    # =======================================================================
    # LEVEL 2: JOB-LEVEL ENVIRONMENT VARIABLES (Job-Scope)
    # What: Configuration variables scoped ONLY to this specific job.
    # Why: Isolates parameters (like compile modes or test profiles) from other jobs.
    # =======================================================================
    env:
      BUILD_PROFILE: "production-optimized"
      NODE_VERSION: "20"

    # =======================================================================
    # JOB OUTPUTS DECLARATION (Multi-Job Variable Handoff)
    # What: Exposes generated values to separate jobs running on completely distinct VMs.
    # Mapping syntax: variable_alias: ${{ steps.STEP_ID.outputs.VAR_KEY }}
    # =======================================================================
    outputs:
      generated_app_version: ${{ steps.calc_version.outputs.computed_version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- INDUSTRY STANDARD RUNTIME SETUP ACTIONS (NATIVE CACHING EXCLUSIONS DESIGN) ---
      # For microservices templates, we keep java and node compilation templates available
      - name: Set up JDK 17 (Java Stack)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # Note: cache: 'maven' is excluded here to prevent template crashes when pom.xml is missing in sandbox

      - name: Set up Node.js Runtime (UI Stack)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # =====================================================================
      # THE "RUN:" COMMAND & CONTEXT ASSIGNMENT INTERVIEW FOCUS
      # How to save variable to same job: Append data to the '$GITHUB_ENV' tracking file.
      # How to save variable to separate job: Append data to the '$GITHUB_OUTPUT' tracking file.
      # =====================================================================
      - name: Calculate Version and Assign Variables
        id: calc_version 
        # =====================================================================
        # LEVEL 3: STEP-LEVEL ENVIRONMENT VARIABLES (Step-Scope)
        # What: Variables loaded natively into the execution shell window of ONE step.
        # =====================================================================
        env:
          STEP_SPECIFIC_DEBUG: "true" 
        run: |
          echo "Step Env (Debug Enabled): $STEP_SPECIFIC_DEBUG"
          RAW_VERSION="v1.0.$(date +%s)"
          
          # Writing variables to our system tracking channels
          echo "INTERNAL_VERSION=$RAW_VERSION" >> $GITHUB_ENV
          echo "computed_version=$RAW_VERSION" >> $GITHUB_OUTPUT

      - name: Verify and Parse Scoped Lists/Maps Variables
        run: |
          echo "Internal version from env context: $INTERNAL_VERSION"
          
          # Parsing space-separated string array list via standard shell loop
          for service in $SERVICE_LIST; do
            echo "Assembling package component: $service"
          done
      # Reading and filtering out key-value pairs from raw JSON string via 'jq' tool
      DEVOPS_EMAIL=$(echo '$TEAM_EMAILS' | jq -r '.devops')
      echo "Successfully extracted target from map context: $DEVOPS_EMAIL"

      # =====================================================================
      # CONCEPT BLOCK: BASH FILE OPERATIONS (Create, Read, Update/Append)
      # What: Basic Linux file manipulation via standard file descriptor redirection.
      # =====================================================================
      - name: Bash File Operations (Create, Update, Read)
        run: |
          # WRITE: Creates a fresh file using single '>' redirection channel
          echo "=== Pipeline Build Log Initialized ===" > build-manifest.txt
          # APPEND: Appends trailing strings without text destruction via '>>'
          echo "Compiled at timestamp: $(date)" >> build-manifest.txt
          echo "Target Registry Destination: $REGISTRY" >> build-manifest.txt
          # READ: Outputs structural configurations out to console via 'cat'
          cat build-manifest.txt

      # =====================================================================
      # CONCEPT BLOCK: PYTHON JSON OPERATIONS (Create, Read, Parse, Update)
      # What: Native inline Python execution used to parse structured datasets safely.
      # Why: Converts plain-text strings into complex maps cleanly, avoiding unverified third-party actions.
      # =====================================================================
      - name: Python JSON Operations (Create, Read, Parse, Update)
        run: |
          python3 -c "import json
          # 1. CREATE & WRITE: Generate a structured configuration map file on disk
          config_map = {'service_name': 'auth-api','runtime': 'python-slim','active_profiles': ['security-hardened', 'oauth-enabled']}
          with open('app-config.json', 'w') as f:
              json.dump(config_map, f, indent=4)
          # 2. READ & PARSE: Extract keys dynamically out of filesystem configurations
          with open('app-config.json', 'r') as f:
              data = json.load(f)
          print(f'Parsed Service Target: {data["service_name"]}')
          # 3. MODIFY & UPDATE: Mutate structures safely without string breaking
          data['pipeline_status'] = 'verified'
          data['active_profiles'].append('monitoring-enabled')
          with open('app-config.json', 'w') as f:
              json.dump(data, f, indent=4)
          print('>>> JSON Configuration Mutated Successfully')"

      # =====================================================================
      # ARTIFACT PERSISTENCE (Saving pipeline outputs to the GitHub UI)
      # Verified Industry Action: actions/upload-artifact@v4 (Official)
      # =====================================================================
      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package-output
          path: |
            build-manifest.txt
            app-config.json

      # =====================================================================
      # SECRETS MANAGEMENT & ARTIFACTORY INTEGRATION INTERVIEW FOCUS
      # What: Secure credentials retrieval mapping across Org/Repo/Env tiers.
      # Why: GHA handles asymmetric encryption at rest and hides stdout with '***' masking.
      # Config Path: Settings -> Secrets and variables -> Actions -> New repository secret.
      # Verified Industry Action: jfrog/setup-jfrog-cli@v4 (Official Integration)
      # =====================================================================
      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          # Pulling encrypted secrets securely out of the GitHub Actions secure context vault
          JF_URL: ${{ secrets.JF_PLATFORM_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

      - name: Publish Binaries to JFrog Artifactory
        run: |
          echo "Authenticating securely using masked GitHub Secrets..."
          # jf rt upload "target/*.jar" "generic-local-repo/java-apps/"

  # =========================================================================
  # STAGE 5: CONTAINER ASSEMBLY AND SECURITY DISCOVERY (SYSDIG)
  # =========================================================================
  container-security:
    runs-on: ubuntu-latest
    needs: build-and-publish-artifacts

    # =======================================================================
    # THE PERMISSIONS LAYER (Security Scoping)
    # What: Restricts the execution boundaries of the internal temporary runtime keys.
    # Why: Enforces Principle of Least Privilege.
    # =======================================================================
    permissions:
      contents: read     # Safe checkout scope
      packages: write    # Grants secure write-access to publish images directly to GHCR

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Dynamic automated short-lived secret token

      # INTERVIEW TRAP FOCUS: Why push false here?
      # Answer: Shift-left pattern compiles image locally to allow Sysdig to verify layers BEFORE pushing public.
      # This completely blocks vulnerable containers from leaking into registry targets.
      - name: Build Local Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Run Sysdig Image Vulnerability Scan
        uses: sysdiglabs/scan-action@v5
        with:
          image-tag: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          sysdig-secure-token: ${{ secrets.SYSDIG_SECURE_TOKEN }}
          sysdig-secure-url: "sysdigcloud.com"

      - name: Push Verified Image to Registry
        if: success() # Gated execution: Only pushes container layer if Sysdig scan completes 100% green!
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # =========================================================================
  # STAGE 6: CLOUD-NATIVE DEPLOYMENT
  # =========================================================================
  deploy-to-kubernetes:
    runs-on: ubuntu-latest
    needs: [build-and-publish-artifacts, container-security]

    # =======================================================================
    # THE PIPE SYNTAX (if: |)
    # What: The pipe character (|) is a YAML Literal Block Scalar parsing multi-line criteria.
    # Logic: Run if it's NOT manual, OR if manual AND confirmation checkbox is checked true.
    # =======================================================================
    if: |
      github.event_name != 'workflow_dispatch' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_confirmation == 'true')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Cross-Job Handoff Verification: Pulling output token generated on Stage 4 VM
      - name: Read Captured App Version From Build Job
        run: |
          echo "Dynamic version passed from Stage 4 outputs: ${{ needs.build-and-publish-artifacts.outputs.generated_app_version }}"

      - name: Inject Image Tag into Manifest
        run: |
          TARGET_ENV="${{ github.event.inputs.environment || 'staging' }}"
          echo "Configuring manifest file for environment: ${TARGET_ENV}"
          # Replaces deployment placeholder tag inside our single file repository target
          # Fixed naming learning check: Singular match validation string 'k8s-manifest.yaml'
          sed -i "s|DYNAMIC_IMAGE_TAG|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g" k8s-manifest.yaml

      - name: Verify Generated Manifest
        run: cat k8s-manifest.yaml

# =========================================================================
# GLOBAL POST-EXECUTION HOOK (The Jenkins Workflow-Level Post Equivalent)
# What: A dedicated final stage that captures the state of the entire workflow run.
# Why: GHA does not support root workflow-level post blocks; this architectural pattern
# replaces it cleanly using job dependencies combined with conditional evaluation steps.
# =========================================================================
global-post-pipeline-handler:
  runs-on: ubuntu-latest
  needs: [sonar-sast-scan, snyk-sca-scan, matrix-unit-testing, build-and-publish-artifacts, container-security, deploy-to-kubernetes]
  if: always() # Forces this job to execute even if any preceding jobs failed or were aborted

  steps:
    # --- SUCCESS HOOK (Jenkins success { ... }) ---
    - name: Global Success Actions
      if: |
        needs.sonar-sast-scan.result == 'success' &&
        needs.snyk-sca-scan.result == 'success' &&
        needs.matrix-unit-testing.result == 'success' &&
        needs.build-and-publish-artifacts.result == 'success' &&
        needs.container-security.result == 'success' &&
        (needs.deploy-to-kubernetes.result == 'success' || needs.deploy-to-kubernetes.result == 'skipped')
      run: |
        echo "🎉 SUCCESS: The entire multi-stack delivery matrix completed perfectly without errors."

    # --- FAILURE HOOK (Jenkins failure { ... }) ---
    - name: Global Failure Actions
      if: |
        needs.sonar-sast-scan.result == 'failure' ||
        needs.snyk-sca-scan.result == 'failure' ||
        needs.matrix-unit-testing.result == 'failure' ||
        needs.build-and-publish-artifacts.result == 'failure' ||
        needs.container-security.result == 'failure' ||
        needs.deploy-to-kubernetes.result == 'failure'
      run: |
        echo "🚨 FAILURE: One or more critical pipeline matrix infrastructure jobs crashed."
