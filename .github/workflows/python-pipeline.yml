name: Production Python Pipeline

# =========================================================================
# TRIGGER LAYER (When does this run?)
# =========================================================================
on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]
  release:
    types: [ published ]
  schedule:
    - cron: '0 0 * * 0' # Automated weekly cleanup/build (Every Sunday at Midnight UTC)
  workflow_dispatch:   # Manual UI execution button
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options: [- staging, - uat, - production]
      deploy_confirmation:
        description: 'Force Deployment? (Leave unchecked to run CI-only)'
        required: true
        default: false
        type: boolean

# =========================================================================
# LEVEL 1: GLOBAL ENVIRONMENT VARIABLES (Workflow-Scope)
# What: Key-value configurations available to EVERY job and step in this file.
# Why: Used for system-wide constants like registry paths or app-wide names.
# Other Options: Can use variables dynamically populated by github metadata.
# =========================================================================
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  APP_TEAM: "devops-core" # Plain text metadata string

jobs:
  # =========================================================================
  # JOB 1: THE COMPILATION AND CONTAINER GENERATION STAGE
  # =========================================================================
  build-and-test:
    runs-on: ubuntu-latest
    
    # =======================================================================
    # LEVEL 2: JOB-LEVEL ENVIRONMENT VARIABLES (Job-Scope)
    # What: Configuration variables scoped ONLY to this specific job.
    # Why: Isolates parameters (like compile modes or test profiles) from other jobs.
    # Other Options: You can reference matrix strategy properties here if using matrix builds.
    # =======================================================================
    env:
      BUILD_PROFILE: "production-optimized"
      PYTHON_VERSION: "3.11"

    permissions:
      contents: read
      packages: write 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # =====================================================================
      # LEVEL 3: STEP-LEVEL ENVIRONMENT VARIABLES (Step-Scope)
      # What: Variables loaded natively into the shell execution window of ONE step.
      # Why: Safest scoping practice for variables required strictly by a single script execution.
      # Other Options: Perfect spot to map repository Secrets securely to specific actions.
      # =====================================================================
      - name: Print Manual Parameters and Environments
        if: github.event_name == 'workflow_dispatch'
        env:
          STEP_SPECIFIC_DEBUG: "true" # Visible only inside this immediate shell execution block
        run: |
          echo "Global Env (Registry): $REGISTRY"
          echo "Job Env (Build Profile): $BUILD_PROFILE"
          echo "Step Env (Debug Enabled): $STEP_SPECIFIC_DEBUG"
          echo "Target Environment Chosen via UI Input: ${{ github.event.inputs.environment }}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} 

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # =========================================================================
  # JOB 2: DEPLOYMENT STAGE
  # =========================================================================
  deploy-to-kubernetes:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    # Conditional logic mapping: Skip execution if manual run, unless user checked override box
    if: |
      github.event_name != 'workflow_dispatch' || 
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_confirmation == 'true')
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Image Tag into Manifest
        run: |
          # Fallback default evaluation logic pattern
          TARGET_ENV="${{ github.event.inputs.environment || 'staging' }}"
          echo "Configuring manifest file for environment: ${TARGET_ENV}"
          sed -i "s|DYNAMIC_IMAGE_TAG|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g" k8s-manifest.yaml
          
      - name: Verify Generated Manifest
        run: cat k8s-manifest.yaml
