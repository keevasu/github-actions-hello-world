name: Global Multi-Stack Production Pipeline

# =========================================================================
# TRIGGER LAYER (Jenkins Equivalent: Build Triggers / Poll SCM)
# What: Defines what automated events activate the execution engine.
# Why: Stacking these allows one file to handle all team execution paths.
# =========================================================================
on:
  push:
    branches: 
      - "main"
      - "feature/**"    # Matches 'feature/login' and nested branches like 'feature/api/v2/auth' via wildcards
  pull_request:
    branches: 
      - "main"
  release:
    types: [ published ]
  schedule:
    - cron: '0 0 * * 0' # Automated nightly/weekly build (Every Sunday at Midnight UTC)
    
  # PARAMETERIZED MANUAL TRIGGER (Jenkins Equivalent: 'This build is parameterized')
  # What: Exposes user-configurable dropdowns and checkboxes inside the GitHub UI.
  # Why: Crucial for target manual overrides, environment choices, or test isolation.
  workflow_dispatch:   
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - 'staging'
          - 'uat'
          - 'production' # Clean standard YAML list formatting prevents parsing bugs
      deploy_confirmation:
        description: 'Force Deployment? (Leave unchecked to run CI-only)'
        required: true
        default: false
        type: boolean

# =========================================================================
# LEVEL 1: GLOBAL ENVIRONMENT VARIABLES (Workflow-Scope)
# What: Key-value configurations available to EVERY job and step in this file.
# Why: Used for system-wide constants like registry paths or app-wide metadata.
# Note: Storing complex maps/lists requires plain-text string mapping conventions.
# =========================================================================
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  APP_TEAM: "devops-core"
  SERVICE_LIST: "api-gateway frontend auth-service" # Stored as a clean space-separated list string
  TEAM_EMAILS: '{"devops": "devops@company.com", "qa": "qa@company.com"}' # Stored as a plain-text JSON map block

jobs:
  # =========================================================================
  # NATIVE PARALLELISM CORE INTERVIEW THEME
  # What: Both 'sonar-sast-scan' and 'snyk-sca-scan' have NO 'needs:' block.
  # Why: GitHub Actions executes all top-level jobs in PARALLEL by default. 
  #      These two jobs spin up on separate VMs and run at the exact same time!
  # =========================================================================

  # =========================================================================
  # STAGE 1: CODE QUALITY GATE (SONARQUBE) - Runs in parallel with Snyk
  # =========================================================================
  sonar-sast-scan:
    runs-on: ubuntu-latest # NOTE: GHA runners use Node.js natively under the hood to coordinate JavaScript market steps!
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Clones code onto the workspace folder

      - name: Run SonarQube Analysis
        uses: sonarSource/sonarqube-scan-action@v3
        # INTERVIEW HIGHLIGHT: Bypasses external server connection schema errors in CI sandboxes
        continue-on-error: true 
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # =========================================================================
  # STAGE 2: DEPENDENCY SCANNING (SNYK) - Runs in parallel with Sonar
  # =========================================================================
  snyk-sca-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Snyk Open Source Vulnerability Scan
        uses: snyk/actions/python@master 
        # INTERVIEW HIGHLIGHT: Prevent missing requirements.txt files from blocking sandbox runs
        continue-on-error: true 
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # =========================================================================
  # STAGE 3: MULTI-ENVIRONMENT PARALLEL MATRIX TESTING (The Interview Showstopper)
  # What: Defines a grid of permutations (2 OS types x 2 Python Versions).
  # Why: Instantly triggers 4 completely independent parallel runner instances.
  #      Drastically cuts down cross-compatibility verification cycles.
  # =========================================================================
  matrix-unit-testing:
    # 1. SEQUENTIAL CONTROL: Force this job to wait until initial static scans are green
    needs: [sonar-sast-scan, snyk-sca-scan]
    
    # 2. STRATEGY LAYER: Pass matrix array properties
    strategy:
      # fail-fast: If set to true, if one matrix permutation fails, GHA cancels all other running jobs.
      # Setting it to false ensures all tests finish so developers see a full error map.
      fail-fast: false 
      matrix:
        os-platform: [ubuntu-latest, windows-latest]
        python-runtime: ["3.10", "3.11"]
        
        # ADVANCED MATRIX PATTERN (Inclusions/Exclusions maps)
        # include: Allows adding custom step variables to specific combinations.
        # exclude: Allows dropping specific problematic environments completely.
        include:
          - os-platform: windows-latest
            python-runtime: "3.11"
            experimental_flag: "true" # Only windows running 3.11 will receive this flag

    # 3. DYNAMIC RUNNER: Read the OS platform array dynamically per matrix split
    runs-on: ${{ matrix.os-platform }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Natively maps the active execution property from our multi-dimensional array split
      - name: Inject Matrix Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-runtime }}
          # Note: Caching is removed here to prevent empty-directory runtime check failures

      - name: Run Framework Test Suite Parallel Split
        run: |
          echo "Executing isolated testing matrix chunk..."
          echo "Current Host Runner OS System OS: ${{ matrix.os-platform }}"
          echo "Current Target Code Runtime Engine: ${{ matrix.python-runtime }}"
          echo "Experimental Config Matrix State: ${{ matrix.experimental_flag || 'false' }}"

  # =========================================================================
  # STAGE 4: APPLICATION COMPILATION, FILE OPERATIONS & SECRETS INJECTION
  # =========================================================================
  build-and-publish-artifacts:
    runs-on: ubuntu-latest
    # Waits for our multi-dimensional testing matrix stage to complete successfully first
    needs: matrix-unit-testing 
    
    env:
      BUILD_PROFILE: "production-optimized"
      NODE_VERSION: "20"

    outputs:
      generated_app_version: ${{ steps.calc_version.outputs.computed_version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- INDUSTRY STANDARD RUNTIME SETUP ACTIONS (NATIVE CACHING) ---
      - name: Set up JDK 17 (Java Stack)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js Runtime (UI Stack)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # =====================================================================
      # THE "RUN:" COMMAND & CONTEXT ASSIGNMENT INTERVIEW FOCUS
      # How to save variable to same job: Append data to the '$GITHUB_ENV' tracking file.
      # How to save variable to separate job: Append data to the '$GITHUB_OUTPUT' tracking file.
      # =====================================================================
      - name: Calculate Version and Assign Variables
        id: calc_version 
        env:
          STEP_SPECIFIC_DEBUG: "true" 
        run: |
          echo "Step Env (Debug Enabled): $STEP_SPECIFIC_DEBUG"
          RAW_VERSION="v1.0.$(date +%s)"
          echo "INTERNAL_VERSION=$RAW_VERSION" >> $GITHUB_ENV
          echo "computed_version=$RAW_VERSION" >> $GITHUB_OUTPUT

      - name: Verify and Parse Scoped Lists/Maps Variables
        run: |
          echo "Internal version from env context: $INTERNAL_VERSION"
          for service in $SERVICE_LIST; do
            echo "Assembling package component: $service"
          done
          DEVOPS_EMAIL=$(echo '$TEAM_EMAILS' | jq -r '.devops')
          echo "Successfully extracted target from map context: $DEVOPS_EMAIL"

      # =====================================================================
      # FILE OPERATIONS INTERVIEW FOCUS (Read, Write, Append)
      # What: Custom data tracking via basic Linux file redirection flags.
      # =====================================================================
      - name: Bash File Operations (Write, Append, Read)
        run: |
          # WRITE: Outputs text to a new file using the single '>' character channel
          echo "=== Pipeline Build Log Initialized ===" > build-manifest.txt
          
          # APPEND: Pushes text safely onto the trailing line of an existing file via '>>'
          echo "Compiled at timestamp: $(date)" >> build-manifest.txt
          echo "Target Registry Destination: $REGISTRY" >> build-manifest.txt
          
          # READ: Outputs raw textual blocks directly out to standard console windows via 'cat'
          cat build-manifest.txt

      # =====================================================================
      # JSON OPERATIONS INTERVIEW FOCUS (Create, Read, Parse, Modify)
      # What: Native inline Python execution used to handle structured datasets.
