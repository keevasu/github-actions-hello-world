name: Python Docker & K8s Pipeline

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  # Converts repository name to lowercase to match image naming standards
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Vital: Allows GitHub Actions to push images to GHCR

    steps:
      # Step 1: Clone the code onto the GitHub runner runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Log in to GitHub's container platform
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Automatically generated by GitHub

      # Step 3: Build the Dockerfile and push it using the unique Git Commit SHA as the tag
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Step 4: Update the K8s manifest with our brand new image tag
      - name: Inject Image Tag into Manifest
        run: |
          sed -i "s|DYNAMIC_IMAGE_TAG|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|g" k8s-manifest.yaml

      # Step 5: Interview Highlight - Dry-Run validation
      - name: Validate Kubernetes Manifests
        run: |
          echo "Simulating cluster deployment via kubectl..."
          kubectl apply -f k8s-manifest.yaml --dry-run=client
          
      # Step 6: Print out the final ready-to-deploy manifest for visibility
      - name: Archive Generated Manifest
        run: cat k8s-manifest.yaml
